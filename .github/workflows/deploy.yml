name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: notebooks/requirements.txt

      - name: Install notebook dependencies
        run: pip install -r notebooks/requirements.txt

      - name: Run notebooks (regenerates data/)
        working-directory: notebooks
        run: |
          mkdir -p /tmp/executed
          for nb in *.ipynb; do
            papermill "$nb" "/tmp/executed/$nb" --kernel python3
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            brand/package-lock.json

      - name: Build website
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build brand guidelines (served at /brand)
        working-directory: brand
        env:
          BRAND_OUT: ../web/dist/brand
          ASTRO_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
